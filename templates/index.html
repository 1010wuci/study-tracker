<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学习记录</title>
    <style>
        body{
            font-family: "microsoft yahei",sans-serif;
            margin: 40px;
            background:#f5f5f5;
        }
        h1 {color: #2c3e50;}
        form{
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }
        label{
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input,textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button:hover{
            background: #2980b9;
        }
        table {
            width: 100%;
            border-collapse:collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }
        th,td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #3498db;
            color: white;
        }
        tr:hover{
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>学习记录</h1>
    <!-- 表单：添加记录 -->
    <p style="color:#2c3e50; font-size:18px;">
        本周学习总时长:<strong>{{ "%.1f"|format(week)}}</strong> 小时
    </p>
    <form action ="/add" method="post">
        <label>日期:</label>
        <input type="date" name="date" required>

        <label>学习内容:</label>
        <textarea name="content" rows="3" required></textarea>

        <label>学习时长</label>
        <input type="number" step="0.5" name="hours" required>

        <label>心情:</label>
        <input type="text" name="mood">

        <button type="submit">添加记录</button>
    </form>
     <h2>所有记录</h2>
    <table>
        <tr>
            <th>日期</th>
            <th>学习内容</th>
            <th>时长</th>
            <th>心情</th>
            <th>操作</th>
        </tr>
        {% for stu in stus %}
        <tr>
            <td>{{ stu[1] }}</td>
            <td>{{ stu[2] }}</td>
            <td>{{ stu[3] }} 小时</td>
            <td>{{ stu[4] }}</td>
            <td><a href="/delete/{{stu[0]}}">删除</a></td>
        </tr>
        {% endfor %}
    </table>
    <h2>每日学习时长</h2>
    <img src="static/chart.png" alt="学习时长表" width="100%" >
</body>
</html>
